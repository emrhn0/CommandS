name: Build and release

# Push a vX.Y.Z tag for stable or vX.Y.Z-beta.N for a prerelease.
#
# The builds go straight onto a draft release rather than through workflow
# artifacts: artifact storage has an account-wide quota, and once it was
# full every release failed at the upload step. The draft is invisible to
# the in-app updater (it reads releases/latest) until the last job
# publishes it.
on:
  push:
    tags:
      - "v*.*.*"
      - "v*.*.*-beta.*"
  workflow_dispatch:
    inputs:
      channel:
        description: Build channel to validate without publishing
        type: choice
        options: [stable, beta]
        default: beta

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      channel: ${{ steps.ver.outputs.channel }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - id: ver
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
            if [[ "${GITHUB_REF}" =~ ^refs/tags/v[0-9]+\.[0-9]+\.[0-9]+-beta\.[0-9]+$ ]]; then
              echo "channel=beta" >> "$GITHUB_OUTPUT"
            elif [[ "${GITHUB_REF}" =~ ^refs/tags/v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "channel=stable" >> "$GITHUB_OUTPUT"
            else
              echo "Unsupported release tag: ${GITHUB_REF}" >&2; exit 1
            fi
          else
            echo "version=0.0.0-dev" >> "$GITHUB_OUTPUT"
            echo "channel=${{ inputs.channel || 'stable' }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Open a draft release for the builds to land on
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            if [[ "$TAG" == *-beta.* ]]; then
              gh release create "$TAG" --draft --prerelease --title "CommandS Beta $TAG" --notes "Building..."
            else
              gh release create "$TAG" --draft --title "CommandS $TAG" --notes "Building..."
            fi
          fi

  windows:
    needs: version
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
      COMMANDS_CHANNEL: ${{ needs.version.outputs.channel }}
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Build Flutter Windows release
        run: |
          flutter pub get
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          flutter analyze lib test --no-fatal-infos
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          flutter test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          flutter build windows --release --dart-define=COMMANDS_CHANNEL=$env:COMMANDS_CHANNEL --dart-define=COMMANDS_VERSION=v$env:VERSION
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Capture pull request screenshot
        if: github.event_name == 'workflow_dispatch'
        shell: pwsh
        env:
          COMMANDS_CAPTURE_PR_SCREENSHOT: '1'
        run: |
          flutter test test/home_header_test.dart
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/pr-images/new-connection-after.png
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git commit -m 'docs: add sidebar layout screenshot'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git push origin "HEAD:${{ github.ref_name }}"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # The fallback SSH client, for a Windows without the OpenSSH client.
      - name: Bundle plink.exe
        shell: pwsh
        run: |
          choco install putty.install --no-progress -y
          $plink = Get-ChildItem -Path "C:\Program Files\PuTTY","C:\Program Files (x86)\PuTTY" `
            -Filter plink.exe -ErrorAction SilentlyContinue -Recurse | Select-Object -First 1
          if (-not $plink) { throw "plink.exe not found after chocolatey install" }
          Copy-Item $plink.FullName "build\windows\x64\runner\Release\plink.exe"

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build installer (.exe)
        shell: pwsh
        run: |
          $options = @("/DMyAppVersion=$env:VERSION")
          if ($env:COMMANDS_CHANNEL -eq 'beta') { $options += '/DBetaBuild' }
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" @options windows\installer.iss

      - name: Zip portable build (no-installer alternative)
        shell: bash
        run: |
          PREFIX="CommandS"
          if [ "$COMMANDS_CHANNEL" = beta ]; then PREFIX="CommandS_Beta"; fi
          OUT="${PREFIX}_${VERSION}_windows_portable"
          mkdir -p "dist2/$OUT"
          cp -r build/windows/x64/runner/Release/* "dist2/$OUT/"
          cd dist2 && 7z a "${OUT}.zip" "$OUT"

      - name: Save beta test build
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: beta-windows-${{ github.run_id }}
          path: |
            dist2/*Setup.exe
            dist2/*portable.zip
          retention-days: 1

      - name: Attach to the draft release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: gh release upload "${GITHUB_REF#refs/tags/}" dist2/*.zip dist2/*Setup.exe --clobber

  macos:
    needs: version
    runs-on: macos-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
      COMMANDS_CHANNEL: ${{ needs.version.outputs.channel }}
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Build Flutter macOS release
        run: |
          flutter pub get
          if [ "$COMMANDS_CHANNEL" = beta ]; then
            perl -pi -e 's/^PRODUCT_NAME = CommandS$/PRODUCT_NAME = CommandS Beta/; s/^PRODUCT_BUNDLE_IDENTIFIER = com\.commands\.commands$/PRODUCT_BUNDLE_IDENTIFIER = com.commands.commands.beta/' macos/Runner/Configs/AppInfo.xcconfig
          fi
          flutter build macos --release --dart-define=COMMANDS_CHANNEL=$COMMANDS_CHANNEL --dart-define=COMMANDS_VERSION=v$VERSION

      - name: Zip the .app (ditto keeps the bundle structure intact)
        shell: bash
        run: |
          mkdir -p dist2
          APP=$(find build/macos/Build/Products/Release -maxdepth 1 -name "*.app")
          PREFIX="CommandS"
          if [ "$COMMANDS_CHANNEL" = beta ]; then PREFIX="CommandS_Beta"; fi
          ditto -c -k --sequesterRsrc --keepParent "$APP" "dist2/${PREFIX}_${VERSION}_macOS.zip"

      - name: Attach to the draft release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: gh release upload "${GITHUB_REF#refs/tags/}" dist2/*.zip --clobber

  release:
    needs: [version, windows, macos]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
      COMMANDS_CHANNEL: ${{ needs.version.outputs.channel }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Publish release
        shell: bash
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          mkdir -p assets
          gh release download "$TAG" -D assets -p '*.zip' -p '*Setup.exe' --clobber
          ls -la assets/

          # The in-app updater downloads the Windows installer and runs it, so
          # it checks the file against this list first (see
          # lib/services/update_service.dart). Bare file names, one per line in
          # sha256sum format, matching the asset names exactly.
          FILES=(assets/*_windows_portable.zip assets/*Setup.exe assets/*_macOS.zip)
          : > SHA256SUMS.txt
          for f in "${FILES[@]}"; do
            printf '%s  %s\n' "$(sha256sum "$f" | cut -d' ' -f1)" "$(basename "$f")" >> SHA256SUMS.txt
          done
          cat SHA256SUMS.txt

          TAG_FILTER='^v[0-9]+\.[0-9]+\.[0-9]+$'
          if [ "$COMMANDS_CHANNEL" = beta ]; then TAG_FILTER='^v[0-9]+\.[0-9]+\.[0-9]+-beta\.[0-9]+$'; fi
          PREV_TAG=$(git tag --list 'v*' --sort=-v:refname | grep -E "$TAG_FILTER" | grep -v "^${TAG}\$" | head -n1 || true)
          if [ -n "$PREV_TAG" ]; then
            # A hand-written list for users (shown in the app's update
            # dialog) when there is one; otherwise the commit subjects.
            if [ -f "release-notes/${TAG}.md" ]; then
              CHANGELOG=$(cat "release-notes/${TAG}.md")
            else
              CHANGELOG=$(git log --pretty=format:'- %s' "${PREV_TAG}..${TAG}" | grep -v '^- Merge ' || true)
            fi
            [ -z "$CHANGELOG" ] && CHANGELOG="- (see commit history)"
            CHANGELOG_HEADER="## What's changed since ${PREV_TAG}"
          else
            CHANGELOG="- Initial release"
            CHANGELOG_HEADER="## What's changed"
          fi

          NAME="CommandS"
          PREFIX="CommandS"
          APP="CommandS.app"
          EXE="commands.exe"
          MIGRATION_NOTE='2. Upgrading from 1.0.23 or earlier: the app used to install as `commands.app`. Delete that one — saved connections move across by themselves on first launch.'
          if [ "$COMMANDS_CHANNEL" = beta ]; then
            NAME="CommandS Beta"; PREFIX="CommandS_Beta"; APP="CommandS Beta.app"; EXE="beta_commands.exe"
            MIGRATION_NOTE=''
          fi
          NOTES="${NAME} ${VERSION}

          ${CHANGELOG_HEADER}
          ${CHANGELOG}

          ## Windows
          - \`..._Setup.exe\` - installer (no admin rights needed, Start Menu + Desktop shortcuts, proper uninstall). Recommended.
          - \`..._portable.zip\` - unzip and run ${EXE} directly, no install.

          ## macOS
          1. Unzip \`${PREFIX}_${VERSION}_macOS.zip\` and drag the app to **Applications**.
          ${MIGRATION_NOTE}
          3. Not notarized (no paid Apple Developer account), so macOS quarantines it on first download. Run this once in Terminal:
             \`\`\`
             xattr -dr com.apple.quarantine "/Applications/${APP}"
             \`\`\`
          "

          gh release upload "$TAG" SHA256SUMS.txt --clobber
          if [ "$COMMANDS_CHANNEL" = beta ]; then
            gh release edit "$TAG" --title "CommandS Beta $TAG" --notes "$NOTES" --draft=false --prerelease --latest=false
          else
            gh release edit "$TAG" --title "CommandS $TAG" --notes "$NOTES" --draft=false --prerelease=false --latest
          fi

      - name: Prune old releases (keep latest 5)
        shell: bash
        run: |
          PRERELEASE=false
          if [ "$COMMANDS_CHANNEL" = beta ]; then PRERELEASE=true; fi
          gh release list --limit 100 --json tagName,publishedAt,isDraft,isPrerelease \
            --jq "[.[] | select(.isDraft == false and .isPrerelease == $PRERELEASE)] | sort_by(.publishedAt) | reverse | .[5:] | .[].tagName" \
          | while read -r old; do
              echo "deleting old release $old"
              gh release delete "$old" --yes || true
            done
