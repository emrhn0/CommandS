name: IP sort preview

on:
  push:
    branches: [feat/sort-connections-by-ip]

permissions:
  contents: read

jobs:
  preview:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter test tool/ip_sort_preview_test.dart --update-goldens
      - uses: actions/upload-artifact@v4
        with:
          name: ip-sort-preview
          path: tool/ip-sort-preview.png
