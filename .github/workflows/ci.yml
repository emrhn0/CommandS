name: Analyze and test

# Every push to master and every pull request: the analyzer must be clean and
# every test must pass. The release workflow runs the same check again before
# it builds anything.
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable

      - name: Analyze and test
        run: |
          flutter pub get
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # Warnings and errors stop the build; info notes (such as a newer
          # Flutter marking an import as deprecated) do not.
          flutter analyze --no-fatal-infos lib test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          flutter test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
